name: Feature request
description: Propose a product or developer experience improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form for well-scoped feature requests.

        If the request changes security posture, privacy defaults, auth flows, or data movement, include that impact clearly.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: This is not a private security vulnerability report.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem is not solved today?
      placeholder: What is painful or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you want to see.
      placeholder: What should the project do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention workarounds or other options you considered.
      placeholder: What else did you evaluate?
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: Security or privacy impact
      description: Note whether this affects local-first defaults, remote providers, auth, storage, or CSP.
      placeholder: No change, or explain the tradeoff.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: What would make this request complete?
      placeholder: List observable outcomes.
    validations:
      required: false
