name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Label PR by Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure version labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'major', color: 'e11d48', description: 'Breaking change — bumps major version' },
              { name: 'minor', color: 'f97316', description: 'New feature — bumps minor version' },
              { name: 'patch', color: '22c55e', description: 'Bug fix or chore — bumps patch version' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch {
                // Label doesn't exist — create it
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
                console.log(`Created label: ${label.name}`);
              }
            }

      - name: Analyze commits and apply label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            let bumpType = 'patch';

            for (const { commit } of commits) {
              const message = commit.message;
              // Breaking change → major (conventional commit spec)
              if (
                message.includes('BREAKING CHANGE') ||
                /^(\w+)(\(.+\))?!:/.test(message)
              ) {
                bumpType = 'major';
                break;
              }
              // New feature → minor
              if (/^feat(\(.+\))?:/.test(message) && bumpType !== 'major') {
                bumpType = 'minor';
              }
            }

            const allVersionLabels = ['major', 'minor', 'patch'];

            // Remove any existing version labels that differ
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const label of currentLabels) {
              if (allVersionLabels.includes(label.name) && label.name !== bumpType) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name: label.name,
                });
              }
            }

            // Add the correct label if not already present
            const hasLabel = currentLabels.some(l => l.name === bumpType);
            if (!hasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [bumpType],
              });
            }

            console.log(`PR #${context.issue.number} labeled as: ${bumpType}`);
